
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sahasra AI - Institutional Intelligence OS</title>
    
    <style>
        :root {
            --bg-deep: #020408;
            --cyan-glow: #06b6d4;
            --indigo-glow: #6366f1;
            --emerald-glow: #10b981;
            --nav-height: 56px;
            --nerve-line: rgba(6, 182, 212, 0.05);
        }
        
        html, body {
            background-color: #020408;
            color: #e5e7eb;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            min-height: 0;
        }

        .app-body-wrapper {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .scppable, .content-scroll-area, .scrollable-node {
            flex: 1;
            overflow-y: auto !important;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
            scroll-behavior: smooth;
            padding-bottom: 120px;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.15); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.3); }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.02) 0%, transparent 50%),
                linear-gradient(var(--nerve-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--nerve-line) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
        }

        .custom-markdown-rendering strong { color: #818cf8; font-weight: 900; }
        .custom-markdown-rendering h1, .custom-markdown-rendering h2 { 
            font-weight: 900; 
            text-transform: uppercase; 
            font-style: italic; 
            margin-bottom: 1.5rem; 
            color: #fff; 
        }

        /* Sahasra AI Specific Animation for the Brain Sync */
        @keyframes sahasra-core-pulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 30px rgba(6, 182, 212, 0.8); }
            100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
        }
        .animate-sahasra-core { animation: sahasra-core-pulse 2s infinite ease-in-out; }

        @keyframes neural-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .neural-orbit-line { 
            transform-origin: center;
            animation: neural-orbit 10s linear infinite;
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#020408]">
    <div id="root" class="app-container"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
